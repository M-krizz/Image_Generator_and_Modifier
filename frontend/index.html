<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered product visualization engine — generate stunning product photographs from a single upload." />
  <title>Product Viz Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background glow blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">ProductViz</span>
    </div>
    <p class="tagline">AI-Powered Product Visualization</p>
  </header>

  <main class="main-container">
    <!-- ===== UPLOAD SECTION ===== -->
    <section class="card upload-section" id="upload-section">
      <h1 class="section-title">Upload &amp; Configure</h1>

      <form id="generate-form" enctype="multipart/form-data">
        <!-- Drop Zone -->
        <div class="dropzone" id="dropzone">
          <div class="dropzone-content" id="dropzone-content">
            <span class="dropzone-icon">📷</span>
            <p class="dropzone-text">Drag &amp; drop your product image</p>
            <p class="dropzone-sub">or click to browse · JPEG, PNG, WebP · Max 10 MB</p>
          </div>
          <img class="preview-image" id="preview-image" alt="Preview" />
          <input type="file" id="file-input" name="image" accept="image/jpeg,image/png,image/webp" hidden />
        </div>

        <!-- Options Row -->
        <div class="options-grid">
          <div class="field">
            <label for="category-select">Product Category</label>
            <select id="category-select" name="category" required>
              <option value="" disabled selected>Select category…</option>
            </select>
          </div>

          <div class="field">
            <label for="style-select">Visual Style</label>
            <select id="style-select" name="style" required>
              <option value="" disabled selected>Select style…</option>
            </select>
          </div>

          <div class="field" id="model-field" style="display:none;">
            <label for="model-select">Model Type</label>
            <select id="model-select" name="modelType">
              <option value="" disabled selected>Select model…</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-generate" id="btn-generate" disabled>
          <span class="btn-text">Generate Images</span>
          <span class="btn-loader" id="btn-loader"></span>
        </button>
      </form>
    </section>

    <!-- ===== PROGRESS SECTION ===== -->
    <section class="card progress-section hidden" id="progress-section">
      <h2 class="section-title">Generating…</h2>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <p class="progress-message" id="progress-message">Starting generation…</p>
    </section>

    <!-- ===== RESULTS SECTION ===== -->
    <section class="card results-section hidden" id="results-section">
      <h2 class="section-title">Results</h2>
      <p class="results-sub" id="results-sub"></p>
      <div class="results-grid" id="results-grid"></div>
      <button class="btn-reset" id="btn-reset">← Generate Another</button>
    </section>

    <!-- ===== ERROR SECTION ===== -->
    <section class="card error-section hidden" id="error-section">
      <h2 class="section-title">⚠️ Something went wrong</h2>
      <p class="error-message" id="error-message"></p>
      <button class="btn-reset" id="btn-error-reset">← Try Again</button>
    </section>
  </main>

  <footer class="footer">
    <p>Powered by Google Gemini · No prompts, pure presets</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
